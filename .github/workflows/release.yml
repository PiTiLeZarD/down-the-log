name: Release

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            tag:
                description: "Tag to release (e.g. v1.0.1)"
                required: true

permissions:
    contents: write

env:
    NODE_VERSION: "24"
    PNPM_VERSION: "11"

jobs:
    # Publishes the web demo to the ghpages branch. Uses the default baseUrl
    # (/down-the-log) so asset paths match the GitHub Pages sub-path.
    pages:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6
              with:
                  version: ${{ env.PNPM_VERSION }}

            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - run: pnpm build:web

            - name: Deploy to ghpages branch
              run: |
                  git config --global user.name "github-actions[bot]"
                  git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  pnpm exec gh-pages -t -b ghpages -d down-the-log \
                    -r "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Builds the desktop bundles on each platform and attaches them to a single
    # GitHub release. TAURI_BUILD strips the baseUrl so assets resolve at root.
    desktop:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: macos-latest
                      rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
                      args: "--target universal-apple-darwin"
                    - platform: ubuntu-22.04
                      rust-targets: ""
                      args: ""
                    - platform: windows-latest
                      rust-targets: ""
                      args: ""

        runs-on: ${{ matrix.platform }}
        steps:
            - uses: actions/checkout@v7

            - name: Install Linux build dependencies
              if: matrix.platform == 'ubuntu-22.04'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    libwebkit2gtk-4.1-dev \
                    libappindicator3-dev \
                    librsvg2-dev \
                    patchelf \
                    libxdo-dev \
                    build-essential

            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.rust-targets }}

            - uses: swatinem/rust-cache@v2
              with:
                  workspaces: "./src-tauri -> target"

            - uses: pnpm/action-setup@v6
              with:
                  version: ${{ env.PNPM_VERSION }}

            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - name: Stamp the tag version into the bundle metadata
              run: node scripts/sync-version.mjs "${{ inputs.tag || github.ref_name }}"

            - uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAURI_BUILD: "1"
              with:
                  tagName: ${{ inputs.tag || github.ref_name }}
                  releaseName: ${{ inputs.tag || github.ref_name }}
                  releaseBody: |
                      Desktop builds of DownTheLog.

                      The macOS and Windows bundles are unsigned. On macOS, right-click the
                      app and choose Open the first time to get past Gatekeeper.

                      Web demo: https://pitilezard.github.io/down-the-log/
                  releaseDraft: true
                  prerelease: false
                  args: ${{ matrix.args }}
